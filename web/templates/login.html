<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in &middot; Site Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v=1">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="card login-card shadow-lg">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="brand-mark mx-auto mb-3"><i class="bi bi-camera-video"></i></div>
          <h1 class="h5 mb-1">Site Intelligence</h1>
          <p class="text-secondary small mb-0">Facility monitoring dashboard</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">
          <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label small text-secondary" for="username">Username</label>
            <input class="form-control" id="username" name="username"
                   autocomplete="username" autofocus required>
          </div>
          <div class="mb-4">
            <label class="form-label small text-secondary" for="password">Password</label>
            <input class="form-control" id="password" name="password"
                   type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
          </button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
